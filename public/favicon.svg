  <defs>
    <linearGradient id="sunGrad" x1="20" y1="20" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="18" y1="50" x2="70" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
</svg>
